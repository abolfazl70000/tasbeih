<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسبیح دیجیتال</title>
    <style>
        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
            border: 5px solid #2c3e50;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 24px;
        }

        #counter {
            font-size: 60px;
            font-weight: bold;
            color: #1a5f7a;
            margin: 20px 0;
            display: block;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn-count {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background-color: #1a5f7a;
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(26, 95, 122, 0.4);
            transition: transform 0.1s, background-color 0.3s;
        }

        .btn-count:active {
            transform: scale(0.95);
            background-color: #134a61;
        }

        .btn-reset {
            padding: 10px 25px;
            border-radius: 10px;
            border: none;
            background-color: #e74c3c;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-reset:hover {
            background-color: #c0392b;
        }

        .footer-text {
            margin-top: 20px;
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>تسبیح دیجیتال</h1>
        
        <span id="counter">0</span>

        <div class="buttons">
            <button class="btn-count" onclick="increment()">ذکر</button>
            <button class="btn-reset" onclick="resetCounter()">صفر کردن</button>
        </div>

        <div class="footer-text">
            یا علی (ع)
        </div>
    </div>

    <script>
        let count = 0;
        const counterDisplay = document.getElementById('counter');

        function increment() {
            count++;
            counterDisplay.innerText = count;
        }

        function resetCounter() {
            if (confirm("آیا مطمئن هستید که می‌خواهید تعداد ذکرها صفر شود؟")) {
                count = 0;
                counterDisplay.innerText = count;
            }
        }
    </script>

</body>
</html>
